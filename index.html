<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#ffffff;color:#1a1a1a;font-family:'Inter',sans-serif;font-weight:300;line-height:1.75;}
.hero{display:flex;flex-direction:column;align-items:center;padding:72px 24px 56px;}
.book-cover{width:min(640px,92vw);display:block;margin:0 auto 48px;}
.hero-text{max-width:640px;text-align:center;}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#888;margin-bottom:16px;}

.author{font-size:13px;letter-spacing:.06em;color:#777;margin-top:16px;}
.cta-btn{display:inline-block;background:#152a52;color:#fff;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;padding:16px 40px;border-radius:2px;transition:background .2s;margin-top:24px;}
.cta-btn:hover{background:#0f1f3d;}
.divider{width:48px;height:1px;background:#d8d8d8;margin:64px auto;}
.content{max-width:640px;margin:0 auto;padding:0 24px;}
.intro-para{font-size:18px;color:#222;margin-bottom:20px;font-weight:400;}
.intro-para.emphasis{font-family:'Playfair Display',serif;font-style:italic;color:#152a52;font-size:19px;}
.body-text{font-size:16px;color:#444;margin-bottom:20px;}
.body-text strong{color:#152a52;font-weight:500;}
h2.section-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;color:#0f0f0f;margin:48px 0 20px;text-align:center;}
.checklist{list-style:none;margin:24px 0;}
.checklist li{display:flex;align-items:flex-start;gap:14px;font-size:15.5px;color:#333;margin-bottom:20px;}
.checklist li::before{content:"✅";flex-shrink:0;margin-top:2px;}
.checklist li strong{color:#152a52;font-weight:500;}
.diff-section{background:#f9f9f9;border-left:3px solid #d4a017;padding:28px;margin:40px 0;border-radius:0 2px 2px 0;}
.diff-section p{font-size:15.5px;color:#444;margin-bottom:14px;}
.diff-section p:last-child{margin-bottom:0;}
.diff-section strong{color:#152a52;}
.testimonials{margin:32px 0;}
.testimonial{font-family:'Playfair Display',serif;font-style:italic;font-size:16px;color:#333;line-height:1.7;padding:22px 24px;background:#fdfaf3;border-radius:2px;margin-bottom:16px;border-left:3px solid #d4a017;}
.for-you-list{list-style:none;margin:24px 0;}
.for-you-list li{display:flex;align-items:flex-start;gap:14px;font-size:15.5px;color:#333;margin-bottom:18px;}
.for-you-list li::before{content:"👉";flex-shrink:0;}
.closing-quote{text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-size:17px;color:#555;line-height:1.8;margin:48px 0 40px;}
.bottom-cta{text-align:center;padding:0 24px 80px;}
.bottom-cta p{font-size:18px;font-weight:500;color:#1a1a1a;margin-bottom:24px;}
footer{border-top:1px solid #ebebeb;text-align:center;padding:24px;font-size:12px;color:#bbb;letter-spacing:.05em;}
</style>
